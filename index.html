<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#ffffff">

  <meta name="app-version" content="2026-09-21-g">

  <title>간트차트</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500&family=Sora:wght@700&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="style.css?v=2026-09-21-g"
  >
</head>

<body>

  <!-- =========================
       상단
  ========================= -->

  <header class="topbar">

    <div class="brand">
      <span class="brand-main">Gantt Chart</span>
      <span class="brand-sep">|</span>
      <span class="brand-sub">Yearly Progress Management</span>
    </div>

    <div class="top-actions">

      <button
        id="keyBtn"
        type="button"
        title="편집 키 다시 입력"
      >
        편집 키
      </button>

      <button
        id="reloadBtn"
        type="button"
      >
        새로고침
      </button>

      <button
        id="fullBtn"
        type="button"
        title="확대를 풀고 1년 전체 보기"
      >
        전체
      </button>

      <button
        id="todayBtn"
        type="button"
        title="오늘 전후 60일 보기"
      >
        오늘
      </button>

    </div>

  </header>


  <main>

    <!-- =========================
         연도
    ========================= -->

    <div class="control-bar">

      <button
        id="prevYear"
        type="button"
        aria-label="이전 연도"
      >
        ‹
      </button>

      <button
        id="yearTitle"
        type="button"
        class="year-title"
        aria-haspopup="dialog"
        aria-expanded="false"
      >
        <span class="year-num">2026</span>
      </button>

      <button
        id="nextYear"
        type="button"
        aria-label="다음 연도"
      >
        ›
      </button>

    </div>


    <!-- =========================
         Gantt
    ========================= -->

    <section class="gantt">

      <!-- 왼쪽 작업명 -->

      <div
        class="task-column"
        id="taskColumn"
      ></div>


      <!-- 오른쪽 Timeline -->

      <div
        class="timeline"
        id="timeline"
      ></div>


      <!-- 표시 범위(위/아래) 슬라이더: app.js 가 손잡이·막대를 채운다 -->

      <div
        class="row-range"
        id="vRangeSlider"
        aria-label="표시 작업 범위"
      ></div>

    </section>


    <!-- 차트 전체 높이 조절 손잡이 -->
    <div
      class="gantt-resize"
      id="chartHeightHandle"
      role="separator"
      aria-orientation="horizontal"
      aria-label="차트 높이 조절"
      title="끌어서 차트 높이 조절"
    ><span></span></div>


    <!-- =========================
         작업 추가
    ========================= -->

    <button
      id="addTaskBtn"
      class="add-box"
      type="button"
    >
      ＋ 작업 추가
    </button>


    <!-- =========================
         카테고리 추가
    ========================= -->

    <button
      id="addCategoryBtn"
      class="add-category-box"
      type="button"
    >
      ＋ 카테고리 추가
    </button>


    <!-- =========================
         확대 / 축소
    ========================= -->

    <section class="zoom-area">

      <div class="zoom-label">

        <span>표시 기간 확대 / 축소</span>

        <span id="rangeLabel"></span>

      </div>

      <!-- 손잡이·막대는 app.js 가 채운다 -->
      <div class="range-slider" id="hRangeSlider" aria-label="표시 기간"></div>

    </section>


    <!-- =========================
         상세정보
    ========================= -->

    <section
      id="detailPanel"
      class="detail-panel hidden"
    ></section>

  </main>


  <!-- =========================
       알림 (저장 중 / 완료)
  ========================= -->

  <div
    id="toast"
    class="toast hidden"
    role="status"
    aria-live="polite"
  ></div>


  <!-- =========================
       작업 추가 Modal
  ========================= -->

  <div
    id="taskModal"
    class="modal hidden"
  >

    <div class="modal-card">

      <div class="modal-header">

        <h2>작업 추가</h2>

        <button
          type="button"
          class="close-btn"
          data-close="taskModal"
          aria-label="닫기"
        >
          ×
        </button>

      </div>


      <label>
        작업명

        <input
          id="taskName"
          type="text"
          placeholder="작업명을 입력하세요"
        >

      </label>


      <label>
        카테고리

        <select id="taskCategory">
          <option value="">
            기타
          </option>
        </select>

      </label>


      <div class="date-grid">

        <label>
          시작일

          <input
            id="taskStart"
            type="date"
          >

        </label>


        <label>
          종료일

          <input
            id="taskEnd"
            type="date"
          >

        </label>

      </div>


      <label>
        진행률 (%)

        <input
          id="taskProgress"
          type="number"
          min="0"
          max="100"
          value="0"
        >

      </label>


      <label>
        막대 색상

        <input
          id="taskColor"
          type="color"
          value="#3b82f6"
        >

        <small>
          바꾸지 않으면 카테고리 기본색을 따릅니다.
        </small>

      </label>


      <label>
        대상처

        <input
          id="taskTarget"
          type="text"
          placeholder="학교 / 회사 / 개인 프로젝트 등"
        >

      </label>


      <label>
        담당자

        <input
          id="taskOwner"
          type="text"
          placeholder="담당자"
        >

      </label>


      <label>
        메모

        <textarea
          id="taskMemo"
          placeholder="메모"
        ></textarea>

      </label>


      <div class="modal-actions">

        <button
          type="button"
          data-close="taskModal"
        >
          취소
        </button>

        <button
          id="saveTaskBtn"
          class="primary"
          type="button"
        >
          저장
        </button>

      </div>

    </div>

  </div>


  <!-- =========================
       카테고리 추가 / 수정 Modal
  ========================= -->

  <div
    id="categoryModal"
    class="modal hidden"
  >

    <div class="modal-card">

      <div class="modal-header">

        <h2 id="categoryModalTitle">카테고리 추가</h2>

        <button
          type="button"
          class="close-btn"
          data-close="categoryModal"
          aria-label="닫기"
        >
          ×
        </button>

      </div>


      <!-- 수정할 때만 값이 들어간다. 비어 있으면 새로 추가 -->
      <input
        id="categoryId"
        type="hidden"
      >


      <label>
        카테고리명

        <input
          id="categoryName"
          type="text"
          placeholder="카테고리명을 입력하세요"
        >

      </label>


      <label>
        기본 막대 색상

        <input
          id="categoryColor"
          type="color"
          value="#3b82f6"
        >

      </label>


      <div class="modal-actions">

        <button
          type="button"
          data-close="categoryModal"
        >
          취소
        </button>

        <button
          id="saveCategoryBtn"
          class="primary"
          type="button"
        >
          저장
        </button>

      </div>

    </div>

  </div>


  <!-- =========================
       JS
  ========================= -->

  <script src="app.js?v=2026-09-21-g"></script>

</body>
</html>
