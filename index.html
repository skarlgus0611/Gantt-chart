<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#ffffff">

  <meta name="app-version" content="2026-10-24-design-v3">

  <title>간트차트</title>

  <!-- 캡처 기능용: DOM을 이미지로 저장 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>


  <link
    rel="stylesheet"
    href="style.css?v=2026-10-24-design-v3"
  >
</head>

<body>

  <!-- =========================================================
       ▼▼▼ 멀티 차트 (추가분) ▼▼▼
       주소에 ?chart=아이디 가 없으면 이 블록(shellView)을 보여주고,
       아래 기존 화면(chartSingleView)은 숨긴다. JS가 안 돌아도
       기존 화면이 기본값으로 보이도록 shellView만 숨김 처리해 둔다.
  ========================================================= -->
  <div id="shellView" style="display:none">

    <div class="mc-shell-layout">

      <!-- ▼▼▼ 접이식 사이드바 (추가분) ▼▼▼ -->
      <aside id="mcSidebar" class="mc-sidebar">
        <div class="mc-sidebar-head">
          <button id="mcSidebarToggle" type="button" class="mc-sidebar-toggle" aria-label="사이드바 접기/펼치기" title="사이드바 접기/펼치기">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
          </button>
        </div>
        <div class="mc-sidebar-body">
          <div class="mc-sidebar-section">
            <div class="mc-sidebar-section-head">
              <span class="mc-sidebar-section-title">내 차트</span>
              <button id="mcSidebarAddBtn" type="button" class="mc-sidebar-add" aria-label="새 차트 추가" title="새 차트 추가">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
              </button>
            </div>
            <nav id="mcSidebarList" class="mc-sidebar-list" aria-label="차트 목록"></nav>
          </div>
          <!-- (디자인 추가분) 공유받은 차트는 따로 묶어서 보여준다. 없으면 통째로 숨김 -->
          <div id="mcSidebarSharedSection" class="mc-sidebar-section hidden">
            <div class="mc-sidebar-section-head">
              <span class="mc-sidebar-section-title">공유받은 차트</span>
            </div>
            <nav id="mcSidebarSharedList" class="mc-sidebar-list" aria-label="공유받은 차트 목록"></nav>
          </div>
        </div>
        <div class="mc-sidebar-foot">
          <button id="mcSidebarManageBtn" type="button" class="mc-sidebar-item mc-sidebar-foot-btn" title="차트 관리">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="3"></rect><path d="M3 10h18M9 10v12"></path></svg>
            <span class="mc-sidebar-item-name">차트 관리</span>
          </button>
        </div>
      </aside>
      <!-- ▲▲▲ 접이식 사이드바 (추가분) 끝 ▲▲▲ -->

      <div class="mc-shell-main">

        <header class="mc-topbar">
          <div class="brand mc-brand">
            <span class="mc-brand-logo" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                <rect x="3" y="5" width="10" height="3.2" rx="1.6" fill="#fff"></rect>
                <rect x="7" y="10.4" width="14" height="3.2" rx="1.6" fill="#fff" opacity="0.85"></rect>
                <rect x="3" y="15.8" width="8" height="3.2" rx="1.6" fill="#fff" opacity="0.6"></rect>
              </svg>
            </span>
            <span class="brand-main">Gantt Chart</span>
            <span class="brand-sep" aria-hidden="true"></span>
            <span class="brand-sub">Yearly Progress Management</span>
          </div>
          <div class="mc-topbar-actions">
            <button id="mcReloadBtn" class="mc-btn mc-btn-ghost mc-btn-icon" type="button" aria-label="새로고침" title="새로고침">
              <svg class="mc-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 15.3-6.4L21 8"></path><path d="M21 3v5h-5"></path><path d="M21 12a9 9 0 0 1-15.3 6.4L3 16"></path><path d="M3 21v-5h5"></path></svg>
            </button>
            <button id="mcExportAllBtn" class="mc-btn mc-btn-ghost" type="button">
              <svg class="mc-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m0 0 4-4m-4 4-4-4"></path><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"></path></svg>
              전체 엑셀로 내보내기
            </button>
            <button id="mcKeyBtn" class="mc-btn mc-btn-ghost" type="button">Google 로그인</button>
            <!-- (요청사항) 지금 어느 구글 계정으로 로그인했는지 프로필 사진으로 표시 -->
            <img id="mcUserAvatar" class="mc-user-avatar hidden" alt="" referrerpolicy="no-referrer">
          </div>
        </header>

        <div class="mc-page">

        <!-- (디자인 추가분) 페이지 제목 줄: 제목 + 차트 검색 + 차트 관리 / 새 차트 -->
        <div class="mc-page-head">
          <div>
            <h1 class="mc-page-title">내 차트</h1>
            <p id="mcChartCount" class="mc-page-sub"></p>
          </div>
          <div class="mc-page-actions">
            <label for="mcSearch" class="mc-visually-hidden">차트 검색</label>
            <div class="mc-search">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.3-3.3"></path></svg>
              <input id="mcSearch" type="search" placeholder="차트 검색" autocomplete="off">
            </div>
            <button id="mcManageBtn" class="mc-btn mc-btn-ghost" type="button">
              <svg class="mc-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="3"></rect><path d="M3 10h18M9 10v12"></path></svg>
              차트 관리
            </button>
            <button id="mcAddBtn" class="mc-btn mc-btn-primary mc-badge-anchor" type="button">
              <svg class="mc-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
              새 차트
              <span id="mcAddBtnBadge" class="mc-badge hidden">0</span>
            </button>
          </div>
        </div>

        <main id="mcChartList" class="mc-chart-list"></main>

        <div id="mcEmpty" class="mc-empty hidden">
          표시할 차트가 없습니다. "＋ 새 차트"를 눌러 추가하세요.
        </div>

        </div>

      </div>
    </div>

    <div id="mcAddModal" class="mc-modal-backdrop hidden">
      <div class="mc-modal">
        <h2>새 차트 추가</h2>
        <label class="mc-field">
          <span>차트 이름</span>
          <input id="mcAddName" type="text" placeholder="예: 시험 준비" maxlength="200">
        </label>
        <p class="mc-hint">
          표시 기간(날짜 범위)과 확대/축소는 차트를 만든 뒤, 그 차트 박스 안에서 바로 설정할 수 있습니다.
        </p>
        <div class="mc-modal-actions">
          <button class="mc-btn mc-btn-ghost" data-close="mcAddModal" type="button">취소</button>
          <button id="mcAddSaveBtn" class="mc-btn mc-btn-primary" type="button">추가</button>
        </div>
      </div>
    </div>

    <div id="mcManageModal" class="mc-modal-backdrop hidden">
      <div class="mc-modal mc-modal-wide">
        <div class="mc-modal-head">
          <h2>차트 관리</h2>
          <button
            class="mc-modal-close"
            data-close="mcManageModal"
            type="button"
            aria-label="닫기"
            title="닫기"
          >&times;</button>
        </div>
        <div id="mcManageRows" class="mc-manage-rows"></div>
      </div>
    </div>

    <!-- (추가분) 캘린더 연동: 안내 박스(확인만) -->
    <div id="mcInfoModal" class="mc-modal-backdrop hidden">
      <div class="mc-modal">
        <p id="mcInfoModalMessage" class="mc-hint"></p>
        <div class="mc-modal-actions">
          <button class="mc-btn mc-btn-primary" data-close="mcInfoModal" type="button">확인</button>
        </div>
      </div>
    </div>

    <!-- (추가분) 캘린더 연동: 삭제 확인 박스(취소/삭제) -->
    <div id="mcCalConfirmModal" class="mc-modal-backdrop hidden">
      <div class="mc-modal">
        <p id="mcCalConfirmMessage" class="mc-hint"></p>
        <div class="mc-modal-actions">
          <button class="mc-btn mc-btn-ghost" data-close="mcCalConfirmModal" type="button">취소</button>
          <button id="mcCalConfirmDeleteBtn" class="mc-btn mc-btn-primary" type="button">삭제</button>
        </div>
      </div>
    </div>

    <!-- (공유 기능 추가분) "＋ 새 차트" 눌렀을 때 먼저 뜨는 선택 박스 -->
    <div id="mcNewOrShareModal" class="mc-modal-backdrop hidden">
      <div class="mc-modal">
        <h2>무엇을 하시겠어요?</h2>
        <div class="mc-share-choice-box">
          <button id="mcNewOrShareNewBtn" class="mc-btn mc-btn-primary mc-share-choice-btn" type="button">새로운 차트 만들기</button>
          <button id="mcNewOrShareReceiveBtn" class="mc-btn mc-btn-ghost mc-share-choice-btn mc-badge-anchor" type="button">
            차트 공유받기
            <span id="mcReceiveBtnBadge" class="mc-badge hidden">0</span>
          </button>
        </div>
        <div class="mc-modal-actions">
          <button class="mc-btn mc-btn-ghost" data-close="mcNewOrShareModal" type="button">취소</button>
        </div>
      </div>
    </div>

    <!-- (공유 기능 추가분) 공유받기: 내가 받은 초대 목록 + 수락/거절 -->
    <div id="mcInvitesModal" class="mc-modal-backdrop hidden">
      <div class="mc-modal mc-modal-wide">
        <div class="mc-modal-head">
          <h2>공유받은 차트</h2>
          <button class="mc-modal-close" data-close="mcInvitesModal" type="button" aria-label="닫기" title="닫기">&times;</button>
        </div>
        <div id="mcInvitesList" class="mc-manage-rows"></div>
      </div>
    </div>

    <!-- (공유 기능 추가분) 차트 공유 관리: 이메일+권한 추가, 멤버 목록, 공유 해제 -->
    <div id="mcShareModal" class="mc-modal-backdrop hidden">
      <div class="mc-modal mc-modal-wide">
        <div class="mc-modal-head">
          <h2>차트 공유 — <span id="mcShareChartName"></span></h2>
          <button class="mc-modal-close" data-close="mcShareModal" type="button" aria-label="닫기" title="닫기">&times;</button>
        </div>

        <div class="mc-share-add-row">
          <input id="mcShareEmail" type="email" placeholder="공유할 구글 계정 이메일">
          <select id="mcShareRole">
            <option value="viewer">뷰어</option>
            <option value="editor">편집자</option>
            <option value="admin">관리자</option>
          </select>
          <button id="mcShareAddBtn" class="mc-btn mc-btn-primary" type="button">추가</button>
        </div>

        <div id="mcShareMemberList" class="mc-manage-rows"></div>

        <div class="mc-modal-actions">
          <button id="mcShareRevokeBtn" class="mc-btn mc-btn-ghost hidden" type="button">나만 보기로 전환(공유 전체 해제)</button>
          <button class="mc-btn mc-btn-primary" data-close="mcShareModal" type="button">닫기</button>
        </div>
      </div>
    </div>

    <!-- (공유 기능 추가분) 공유 구성원 보기 (읽기 전용) -->
    <div id="mcMembersModal" class="mc-modal-backdrop hidden">
      <div class="mc-modal mc-modal-wide">
        <div class="mc-modal-head">
          <h2>공유 구성원</h2>
          <button class="mc-modal-close" data-close="mcMembersModal" type="button" aria-label="닫기" title="닫기">&times;</button>
        </div>
        <div id="mcMembersList" class="mc-manage-rows"></div>
      </div>
    </div>

    <div id="mcToast" class="mc-toast hidden"></div>

  </div>
  <!-- ▲▲▲ 멀티 차트 (추가분) 끝 ▲▲▲ -->


  <div id="chartSingleView">

  <!-- =========================
       상단
  ========================= -->

  <header class="topbar">

    <div class="brand">
      <span
        class="brand-main"
        id="chartNameLabel"
        tabindex="0"
        role="button"
        title="눌러서 이 차트 이름 수정"
      >Gantt Chart</span>
    </div>

    <div class="top-actions">

      <button
        id="reloadBtn"
        type="button"
        aria-label="새로고침"
        title="새로고침"
      ><svg class="mc-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 15.3-6.4L21 8"></path><path d="M21 3v5h-5"></path><path d="M21 12a9 9 0 0 1-15.3 6.4L3 16"></path><path d="M3 21v-5h5"></path></svg></button>

      <button
        id="fullBtn"
        type="button"
        aria-label="전체"
        title="확대를 풀고 1년 전체 보기"
      ><svg class="mc-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"></path></svg></button>

      <button
        id="todayBtn"
        type="button"
        aria-label="오늘"
        title="오늘 전후 60일 보기"
      ><svg class="mc-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="16" rx="3"></rect><path d="M3.5 9.5h17"></path><circle cx="12" cy="15" r="1.6" fill="currentColor" stroke="none"></circle></svg></button>

      <button
        id="captureBtn"
        type="button"
        aria-label="캡처"
        title="지금 확대 상태와 무관하게, 이 연도 전체를 이미지로 저장"
      ><svg class="mc-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8.5A1.5 1.5 0 0 1 5.5 7h2l1-1.8h7l1 1.8h2A1.5 1.5 0 0 1 20 8.5v9A1.5 1.5 0 0 1 18.5 19h-13A1.5 1.5 0 0 1 4 17.5z"></path><circle cx="12" cy="12.5" r="3.4"></circle></svg></button>

    </div>

  </header>


  <main>

    <!-- =========================
         연도
    ========================= -->

    <div class="control-bar">

      <button
        id="prevYear"
        type="button"
        aria-label="이전 연도"
      ><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></button>

      <button
        id="yearTitle"
        type="button"
        class="year-title"
        aria-haspopup="dialog"
        aria-expanded="false"
      >
        <span class="year-num">2026</span>
      </button>

      <button
        id="nextYear"
        type="button"
        aria-label="다음 연도"
      ><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></button>

    </div>


    <!-- =========================================================
         ▼▼▼ 멀티 차트 (추가분): 이 차트만의 표시 기간 설정 ▼▼▼
         연도와 무관하게(연도 걸쳐도 됨) 이 차트의 기본 표시 구간을 정함.
         비워두면 기존처럼 "연도 단위"로 그대로 동작한다.
    ========================================================= -->
    <section class="custom-range-area" id="customRangeArea">
      <div class="custom-range-row">
        <span class="custom-range-label">표시 기간(이 차트만)</span>
        <input type="date" id="chartRangeStart" aria-label="표시 시작일">
        <span class="custom-range-sep">~</span>
        <input type="date" id="chartRangeEnd" aria-label="표시 종료일">
        <button type="button" id="chartRangeSaveBtn" class="custom-range-btn">저장</button>
        <button type="button" id="chartRangeClearBtn" class="custom-range-btn custom-range-btn-ghost hidden">연도 보기로</button>
      </div>
    </section>
    <!-- ▲▲▲ 멀티 차트 (추가분) 끝 ▲▲▲ -->


    <!-- =========================
         Gantt
    ========================= -->

    <section class="gantt">

      <!-- 왼쪽 작업명 -->

      <div
        class="task-column"
        id="taskColumn"
      ></div>


      <!-- 오른쪽 Timeline -->

      <div
        class="timeline"
        id="timeline"
      ></div>


      <!-- 표시 범위(위/아래) 슬라이더: app.js 가 손잡이·막대를 채운다 -->

      <div
        class="row-range"
        id="vRangeSlider"
        aria-label="표시 작업 범위"
      ></div>

    </section>


    <!-- 차트 전체 높이 조절 손잡이 -->
    <div
      class="gantt-resize"
      id="chartHeightHandle"
      role="separator"
      aria-orientation="horizontal"
      aria-label="차트 높이 조절"
      title="끌어서 차트 높이 조절"
    ><span></span></div>


    <!-- =========================
         작업 추가
    ========================= -->

    <button
      id="addTaskBtn"
      class="add-box"
      type="button"
    >
      ＋ 작업 추가
    </button>


    <!-- =========================
         카테고리 추가
    ========================= -->

    <button
      id="addCategoryBtn"
      class="add-category-box"
      type="button"
    >
      ＋ 카테고리 추가
    </button>


    <!-- =========================
         확대 / 축소
    ========================= -->

    <section class="zoom-area">

      <div class="zoom-label">

        <span>표시 기간 확대 / 축소</span>

        <span id="rangeLabel"></span>

      </div>

      <!-- 손잡이·막대는 app.js 가 채운다 -->
      <div class="range-slider" id="hRangeSlider" aria-label="표시 기간"></div>

    </section>


    <!-- =========================
         상세정보
    ========================= -->

    <section
      id="detailPanel"
      class="detail-panel hidden"
    ></section>

  </main>


  <!-- =========================
       알림 (저장 중 / 완료)
  ========================= -->

  <div
    id="toast"
    class="toast hidden"
    role="status"
    aria-live="polite"
  ></div>


  <!-- =========================
       작업 추가 Modal
  ========================= -->

  <div
    id="taskModal"
    class="modal hidden"
  >

    <div class="modal-card">

      <div class="modal-header">

        <h2>작업 추가</h2>

        <button
          type="button"
          class="close-btn"
          data-close="taskModal"
          aria-label="닫기"
        >
          ×
        </button>

      </div>


      <label>
        작업명

        <input
          id="taskName"
          type="text"
          placeholder="작업명을 입력하세요"
        >

      </label>


      <label>
        카테고리

        <select id="taskCategory">
          <option value="">
            기타
          </option>
        </select>

      </label>


      <div class="date-grid">

        <label>
          시작일

          <input
            id="taskStart"
            type="date"
          >

        </label>


        <label>
          종료일

          <input
            id="taskEnd"
            type="date"
          >

        </label>

      </div>


      <label>
        진행률 (%)

        <input
          id="taskProgress"
          type="number"
          min="0"
          max="100"
          value="0"
        >

      </label>


      <label>
        막대 색상

        <input
          id="taskColor"
          type="color"
          value="#3b82f6"
        >

        <small>
          바꾸지 않으면 카테고리 기본색을 따릅니다.
        </small>

      </label>


      <label>
        대상처

        <input
          id="taskTarget"
          type="text"
          placeholder="학교 / 회사 / 개인 프로젝트 등"
        >

      </label>


      <label>
        담당자

        <input
          id="taskOwner"
          type="text"
          placeholder="담당자"
        >

      </label>


      <label>
        메모

        <textarea
          id="taskMemo"
          placeholder="메모"
        ></textarea>

      </label>


      <div class="modal-actions">

        <button
          type="button"
          data-close="taskModal"
        >
          취소
        </button>

        <button
          id="saveTaskBtn"
          class="primary"
          type="button"
        >
          저장
        </button>

      </div>

    </div>

  </div>


  <!-- =========================
       카테고리 추가 / 수정 Modal
  ========================= -->

  <div
    id="categoryModal"
    class="modal hidden"
  >

    <div class="modal-card">

      <div class="modal-header">

        <h2 id="categoryModalTitle">카테고리 추가</h2>

        <button
          type="button"
          class="close-btn"
          data-close="categoryModal"
          aria-label="닫기"
        >
          ×
        </button>

      </div>


      <!-- 수정할 때만 값이 들어간다. 비어 있으면 새로 추가 -->
      <input
        id="categoryId"
        type="hidden"
      >


      <label>
        카테고리명

        <input
          id="categoryName"
          type="text"
          placeholder="카테고리명을 입력하세요"
        >

      </label>


      <label>
        기본 막대 색상

        <input
          id="categoryColor"
          type="color"
          value="#3b82f6"
        >

      </label>


      <div class="modal-actions">

        <button
          type="button"
          data-close="categoryModal"
        >
          취소
        </button>

        <button
          id="saveCategoryBtn"
          class="primary"
          type="button"
        >
          저장
        </button>

      </div>

    </div>

  </div>

  </div>
  <!-- /#chartSingleView -->


  <!-- =========================
       JS
  ========================= -->

  <script type="module" src="app.js?v=2026-10-24-design-v3"></script>

</body>
</html>
