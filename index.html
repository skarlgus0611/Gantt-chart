<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#ffffff">

  <meta name="app-version" content="2026-09-21-q">

  <title>간트차트</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500&family=Sora:wght@700&display=swap"
    rel="stylesheet"
  >

  <!-- 캡처 기능용: DOM을 이미지로 저장 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <link
    rel="stylesheet"
    href="style.css?v=2026-09-21-q"
  >
</head>

<body>

  <!-- =========================================================
       ▼▼▼ 멀티 차트 (추가분) ▼▼▼
       주소에 ?chart=아이디 가 없으면 이 블록(shellView)을 보여주고,
       아래 기존 화면(chartSingleView)은 숨긴다. JS가 안 돌아도
       기존 화면이 기본값으로 보이도록 shellView만 숨김 처리해 둔다.
  ========================================================= -->
  <div id="shellView" style="display:none">

    <header class="mc-topbar">
      <div class="brand mc-brand">
        <span class="brand-main">Gantt Chart</span>
        <span class="brand-sep">|</span>
        <span class="brand-sub">전체 차트 모음</span>
      </div>
      <div class="mc-topbar-actions">
        <button id="mcKeyBtn" class="mc-btn mc-btn-ghost" type="button">키</button>
        <button id="mcReloadBtn" class="mc-btn mc-btn-ghost" type="button">새로고침</button>
        <button id="mcManageBtn" class="mc-btn mc-btn-ghost" type="button">차트 관리</button>
        <button id="mcAddBtn" class="mc-btn mc-btn-primary" type="button">＋ 새 차트</button>
      </div>
    </header>

    <main id="mcChartList" class="mc-chart-list"></main>

    <div id="mcEmpty" class="mc-empty hidden">
      표시할 차트가 없습니다. "＋ 새 차트"를 눌러 추가하세요.
    </div>

    <div id="mcAddModal" class="mc-modal-backdrop hidden">
      <div class="mc-modal">
        <h2>새 차트 추가</h2>
        <label class="mc-field">
          <span>차트 이름</span>
          <input id="mcAddName" type="text" placeholder="예: 시험 준비" maxlength="200">
        </label>
        <p class="mc-hint">
          표시 기간(날짜 범위)과 확대/축소는 차트를 만든 뒤, 그 차트 박스 안에서 바로 설정할 수 있습니다.
        </p>
        <div class="mc-modal-actions">
          <button class="mc-btn mc-btn-ghost" data-close="mcAddModal" type="button">취소</button>
          <button id="mcAddSaveBtn" class="mc-btn mc-btn-primary" type="button">추가</button>
        </div>
      </div>
    </div>

    <div id="mcManageModal" class="mc-modal-backdrop hidden">
      <div class="mc-modal mc-modal-wide">
        <div class="mc-modal-head">
          <h2>차트 관리</h2>
          <button
            class="mc-modal-close"
            data-close="mcManageModal"
            type="button"
            aria-label="닫기"
            title="닫기"
          >&times;</button>
        </div>
        <div id="mcManageRows" class="mc-manage-rows"></div>
      </div>
    </div>

    <div id="mcToast" class="mc-toast hidden"></div>

  </div>
  <!-- ▲▲▲ 멀티 차트 (추가분) 끝 ▲▲▲ -->


  <div id="chartSingleView">

  <!-- =========================
       상단
  ========================= -->

  <header class="topbar">

    <div class="brand">
      <span
        class="brand-main"
        id="chartNameLabel"
        tabindex="0"
        role="button"
        title="눌러서 이 차트 이름 수정"
      >Gantt Chart</span>
      <span class="brand-sep">|</span>
      <span class="brand-sub">Yearly Progress Management</span>
    </div>

    <div class="top-actions">

      <button
        id="reloadBtn"
        type="button"
      >
        새로고침
      </button>

      <button
        id="fullBtn"
        type="button"
        title="확대를 풀고 1년 전체 보기"
      >
        전체
      </button>

      <button
        id="todayBtn"
        type="button"
        title="오늘 전후 60일 보기"
      >
        오늘
      </button>

      <button
        id="captureBtn"
        type="button"
        title="지금 확대 상태와 무관하게, 이 연도 전체를 이미지로 저장"
      >
        캡처
      </button>

    </div>

  </header>


  <main>

    <!-- =========================
         연도
    ========================= -->

    <div class="control-bar">

      <button
        id="prevYear"
        type="button"
        aria-label="이전 연도"
      >
        ‹
      </button>

      <button
        id="yearTitle"
        type="button"
        class="year-title"
        aria-haspopup="dialog"
        aria-expanded="false"
      >
        <span class="year-num">2026</span>
      </button>

      <button
        id="nextYear"
        type="button"
        aria-label="다음 연도"
      >
        ›
      </button>

    </div>


    <!-- =========================================================
         ▼▼▼ 멀티 차트 (추가분): 이 차트만의 표시 기간 설정 ▼▼▼
         연도와 무관하게(연도 걸쳐도 됨) 이 차트의 기본 표시 구간을 정함.
         비워두면 기존처럼 "연도 단위"로 그대로 동작한다.
    ========================================================= -->
    <section class="custom-range-area" id="customRangeArea">
      <div class="custom-range-row">
        <span class="custom-range-label">표시 기간(이 차트만)</span>
        <input type="date" id="chartRangeStart" aria-label="표시 시작일">
        <span class="custom-range-sep">~</span>
        <input type="date" id="chartRangeEnd" aria-label="표시 종료일">
        <button type="button" id="chartRangeSaveBtn" class="custom-range-btn">저장</button>
        <button type="button" id="chartRangeClearBtn" class="custom-range-btn custom-range-btn-ghost hidden">연도 보기로</button>
      </div>
    </section>
    <!-- ▲▲▲ 멀티 차트 (추가분) 끝 ▲▲▲ -->


    <!-- =========================
         Gantt
    ========================= -->

    <section class="gantt">

      <!-- 왼쪽 작업명 -->

      <div
        class="task-column"
        id="taskColumn"
      ></div>


      <!-- 오른쪽 Timeline -->

      <div
        class="timeline"
        id="timeline"
      ></div>


      <!-- 표시 범위(위/아래) 슬라이더: app.js 가 손잡이·막대를 채운다 -->

      <div
        class="row-range"
        id="vRangeSlider"
        aria-label="표시 작업 범위"
      ></div>

    </section>


    <!-- 차트 전체 높이 조절 손잡이 -->
    <div
      class="gantt-resize"
      id="chartHeightHandle"
      role="separator"
      aria-orientation="horizontal"
      aria-label="차트 높이 조절"
      title="끌어서 차트 높이 조절"
    ><span></span></div>


    <!-- =========================
         작업 추가
    ========================= -->

    <button
      id="addTaskBtn"
      class="add-box"
      type="button"
    >
      ＋ 작업 추가
    </button>


    <!-- =========================
         카테고리 추가
    ========================= -->

    <button
      id="addCategoryBtn"
      class="add-category-box"
      type="button"
    >
      ＋ 카테고리 추가
    </button>


    <!-- =========================
         확대 / 축소
    ========================= -->

    <section class="zoom-area">

      <div class="zoom-label">

        <span>표시 기간 확대 / 축소</span>

        <span id="rangeLabel"></span>

      </div>

      <!-- 손잡이·막대는 app.js 가 채운다 -->
      <div class="range-slider" id="hRangeSlider" aria-label="표시 기간"></div>

    </section>


    <!-- =========================
         상세정보
    ========================= -->

    <section
      id="detailPanel"
      class="detail-panel hidden"
    ></section>

  </main>


  <!-- =========================
       알림 (저장 중 / 완료)
  ========================= -->

  <div
    id="toast"
    class="toast hidden"
    role="status"
    aria-live="polite"
  ></div>


  <!-- =========================
       작업 추가 Modal
  ========================= -->

  <div
    id="taskModal"
    class="modal hidden"
  >

    <div class="modal-card">

      <div class="modal-header">

        <h2>작업 추가</h2>

        <button
          type="button"
          class="close-btn"
          data-close="taskModal"
          aria-label="닫기"
        >
          ×
        </button>

      </div>


      <label>
        작업명

        <input
          id="taskName"
          type="text"
          placeholder="작업명을 입력하세요"
        >

      </label>


      <label>
        카테고리

        <select id="taskCategory">
          <option value="">
            기타
          </option>
        </select>

      </label>


      <div class="date-grid">

        <label>
          시작일

          <input
            id="taskStart"
            type="date"
          >

        </label>


        <label>
          종료일

          <input
            id="taskEnd"
            type="date"
          >

        </label>

      </div>


      <label>
        진행률 (%)

        <input
          id="taskProgress"
          type="number"
          min="0"
          max="100"
          value="0"
        >

      </label>


      <label>
        막대 색상

        <input
          id="taskColor"
          type="color"
          value="#3b82f6"
        >

        <small>
          바꾸지 않으면 카테고리 기본색을 따릅니다.
        </small>

      </label>


      <label>
        대상처

        <input
          id="taskTarget"
          type="text"
          placeholder="학교 / 회사 / 개인 프로젝트 등"
        >

      </label>


      <label>
        담당자

        <input
          id="taskOwner"
          type="text"
          placeholder="담당자"
        >

      </label>


      <label>
        메모

        <textarea
          id="taskMemo"
          placeholder="메모"
        ></textarea>

      </label>


      <div class="modal-actions">

        <button
          type="button"
          data-close="taskModal"
        >
          취소
        </button>

        <button
          id="saveTaskBtn"
          class="primary"
          type="button"
        >
          저장
        </button>

      </div>

    </div>

  </div>


  <!-- =========================
       카테고리 추가 / 수정 Modal
  ========================= -->

  <div
    id="categoryModal"
    class="modal hidden"
  >

    <div class="modal-card">

      <div class="modal-header">

        <h2 id="categoryModalTitle">카테고리 추가</h2>

        <button
          type="button"
          class="close-btn"
          data-close="categoryModal"
          aria-label="닫기"
        >
          ×
        </button>

      </div>


      <!-- 수정할 때만 값이 들어간다. 비어 있으면 새로 추가 -->
      <input
        id="categoryId"
        type="hidden"
      >


      <label>
        카테고리명

        <input
          id="categoryName"
          type="text"
          placeholder="카테고리명을 입력하세요"
        >

      </label>


      <label>
        기본 막대 색상

        <input
          id="categoryColor"
          type="color"
          value="#3b82f6"
        >

      </label>


      <div class="modal-actions">

        <button
          type="button"
          data-close="categoryModal"
        >
          취소
        </button>

        <button
          id="saveCategoryBtn"
          class="primary"
          type="button"
        >
          저장
        </button>

      </div>

    </div>

  </div>

  </div>
  <!-- /#chartSingleView -->


  <!-- =========================
       JS
  ========================= -->

  <script src="app.js?v=2026-09-21-q"></script>

</body>
</html>
