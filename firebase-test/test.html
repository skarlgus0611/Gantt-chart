<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Firebase 연동 테스트</title>
<style>
  body { font-family: sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
  button { padding: 8px 14px; margin: 4px 4px 4px 0; cursor: pointer; }
  input { padding: 6px; margin: 4px 4px 4px 0; }
  .chart-box { border: 1px solid #ccc; border-radius: 8px; padding: 12px; margin: 12px 0; }
  .task-row { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
  .swatch { width: 18px; height: 18px; border-radius: 4px; display: inline-block; }
  #log { white-space: pre-wrap; background: #f5f5f5; padding: 8px; font-size: 12px; max-height: 200px; overflow: auto; }
</style>
</head>
<body>
  <h2>Firebase 연동 테스트 (POC)</h2>
  <p>기존 사이트와 완전히 별개. 이 페이지에서만 동작 확인용.</p>

  <div id="authBox">
    <button id="loginBtn">Google 로그인(캘린더 권한 포함)</button>
    <button id="logoutBtn" style="display:none">로그아웃</button>
    <span id="whoami"></span>
  </div>

  <div id="appBox" style="display:none">
    <h3>차트</h3>
    <input id="newChartName" placeholder="새 차트 이름">
    <button id="createChartBtn">차트 만들기</button>
    <div id="chartList"></div>
  </div>

  <h3>로그</h3>
  <div id="log"></div>

  <script type="module">
    import {
      signIn, signOutUser, onAuthChange, currentUser,
      createChart, listenMyCharts, deleteChart,
      listenTasks, createTask, updateTask, deleteTask,
      listenCategories, createCategory, updateCategory
    } from "./firebase-core.js";

    const logBox = document.getElementById("log");
    function log(msg) {
      logBox.textContent = new Date().toLocaleTimeString() + " " + msg + "\n" + logBox.textContent;
    }

    const chartUnsubs = {}; // chartId -> {tasks: fn, cats: fn}

    document.getElementById("loginBtn").addEventListener("click", async () => {
      try {
        const { user, calendarAccessToken } = await signIn();
        log("로그인 성공: " + user.email + " / 캘린더 토큰 " + (calendarAccessToken ? "받음" : "없음"));
      } catch (e) {
        log("로그인 실패: " + e.message);
      }
    });

    document.getElementById("logoutBtn").addEventListener("click", () => signOutUser());

    document.getElementById("createChartBtn").addEventListener("click", async () => {
      const name = document.getElementById("newChartName").value.trim() || "새 차트";
      const user = currentUser();
      if (!user) return;
      await createChart(user.uid, user.email, name);
      document.getElementById("newChartName").value = "";
      log("차트 생성: " + name);
    });

    let myChartsUnsub = null;

    onAuthChange((user) => {
      document.getElementById("loginBtn").style.display = user ? "none" : "";
      document.getElementById("logoutBtn").style.display = user ? "" : "none";
      document.getElementById("appBox").style.display = user ? "" : "none";
      document.getElementById("whoami").textContent = user ? (" " + user.email) : "";

      if (myChartsUnsub) { myChartsUnsub(); myChartsUnsub = null; }
      document.getElementById("chartList").innerHTML = "";

      if (!user) return;

      myChartsUnsub = listenMyCharts(user.uid, user.email, (charts) => {
        log("차트 목록 갱신: " + charts.length + "개");
        renderCharts(charts);
      });
    });

    function renderCharts(charts) {
      const box = document.getElementById("chartList");
      box.innerHTML = "";
      charts.forEach((chart) => {
        const div = document.createElement("div");
        div.className = "chart-box";
        div.innerHTML =
          "<b>" + chart.name + "</b> (id: " + chart.id + ")" +
          " <button data-action='delete'>차트 삭제</button>" +
          " <button data-action='addcat'>카테고리 추가</button>" +
          " <button data-action='addtask'>작업 추가</button>" +
          "<div class='cats'></div><div class='tasks'></div>";

        div.querySelector("[data-action=delete]").addEventListener("click", () => {
          deleteChart(chart.id);
          log("차트 삭제: " + chart.name);
        });
        div.querySelector("[data-action=addcat]").addEventListener("click", () => {
          createCategory(chart.id, { name: "카테고리" + Math.floor(Math.random() * 100), color: "#4f8ef7" });
        });
        div.querySelector("[data-action=addtask]").addEventListener("click", () => {
          createTask(chart.id, { name: "작업" + Math.floor(Math.random() * 100), color: "#ff8800" });
        });

        box.appendChild(div);

        listenCategories(chart.id, (cats) => {
          const catBox = div.querySelector(".cats");
          catBox.innerHTML = "카테고리: ";
          cats.forEach((c) => {
            const span = document.createElement("span");
            span.className = "task-row";
            span.innerHTML =
              "<span class='swatch' style='background:" + c.color + "'></span> " + c.name +
              " <input type='color' value='" + c.color + "' data-cat='" + c.id + "'>";
            span.querySelector("input").addEventListener("input", (e) => {
              updateCategory(chart.id, c.id, { color: e.target.value });
              log("카테고리 색상 변경 시도: " + c.name + " -> " + e.target.value);
            });
            catBox.appendChild(span);
          });
        });

        listenTasks(chart.id, (tasks) => {
          const taskBox = div.querySelector(".tasks");
          taskBox.innerHTML = "작업: ";
          tasks.forEach((t) => {
            const row = document.createElement("div");
            row.className = "task-row";
            row.innerHTML =
              "<span class='swatch' style='background:" + (t.color || "#ccc") + "'></span> " + t.name +
              " <input type='color' value='" + (t.color || "#4f8ef7") + "' data-task='" + t.id + "'>" +
              " <button data-del='" + t.id + "'>삭제</button>";
            row.querySelector("input").addEventListener("input", (e) => {
              updateTask(chart.id, t.id, { color: e.target.value });
            });
            row.querySelector("button").addEventListener("click", () => deleteTask(chart.id, t.id));
            taskBox.appendChild(row);
          });
        });
      });
    }
  </script>
</body>
</html>
