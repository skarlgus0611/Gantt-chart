# (요청사항) 마감 알림 서버(functions/)를 GitHub 가 대신 Firebase 에 올린다.
# - main 에 functions/ 가 바뀌어 합쳐지면 자동으로, 또는 Actions 탭에서 "Run workflow" 로 직접
# - 필요한 비밀값 (저장소 Settings → Secrets and variables → Actions):
#     FIREBASE_SERVICE_ACCOUNT : 배포용 서비스 계정 키(JSON 파일 내용 통째로)
#     SMTP_USER                : 알림 메일을 보낼 Gmail 주소
#     SMTP_PASS                : 그 Gmail 의 앱 비밀번호(16자리)
name: Deploy notice functions

on:
  push:
    branches: [main]
    paths:
      - "functions/**"
      - "firebase.json"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch:

concurrency:
  group: deploy-functions
  cancel-in-progress: false

env:
  PROJECT_ID: gantt-chart-e06b8

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install function dependencies
        run: npm install --prefix functions --no-audit --no-fund

      - name: Check notice rules
        run: node functions/test-digest.js

      - name: Sign in to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Save mail secrets
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          printf '%s' "$SMTP_USER" | firebase functions:secrets:set SMTP_USER --data-file=- --project "$PROJECT_ID" --non-interactive --force
          printf '%s' "$SMTP_PASS" | firebase functions:secrets:set SMTP_PASS --data-file=- --project "$PROJECT_ID" --non-interactive --force

      - name: Deploy
        run: firebase deploy --only functions --project "$PROJECT_ID" --non-interactive --force
